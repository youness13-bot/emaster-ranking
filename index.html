<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>E-MASTER RANKING</title>
  <meta name="description" content="E-MASTER Clan Power Ranking">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #0866ff;
      --blue-dark: #0645b8;
      --blue-light: #eaf2ff;
      --white: #ffffff;
      --bg: #f5f8fc;
      --text: #0d1b2a;
      --muted: #718096;
      --border: #e4ebf4;
      --green: #13a66a;
      --red: #e5484d;
      --gold: #d99b19;
      --shadow: 0 15px 45px rgba(20, 60, 110, .08);
    }

    body {
      font-family: "Cairo", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ================= HEADER ================= */

    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(228,235,244,.9);
    }

    .nav {
      max-width: 1180px;
      height: 72px;
      margin: auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(145deg, var(--blue), #0b49c8);
      display: grid;
      place-items: center;
      color: white;
      font-family: "Oswald", sans-serif;
      font-weight: 700;
      font-size: 17px;
      box-shadow: 0 8px 22px rgba(8,102,255,.25);
    }

    .brand-text strong {
      display: block;
      font-family: "Oswald", sans-serif;
      letter-spacing: .5px;
      font-size: 18px;
    }

    .brand-text span {
      display: block;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 1.5px;
      font-weight: 700;
      margin-top: -2px;
    }

    .admin-btn {
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      padding: 9px 15px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      transition: .25s ease;
    }

    .admin-btn:hover {
      border-color: var(--blue);
      color: var(--blue);
      transform: translateY(-2px);
    }

    /* ================= HERO ================= */

    .hero {
      max-width: 1180px;
      margin: auto;
      padding: 62px 20px 35px;
    }

    .hero-box {
      position: relative;
      overflow: hidden;
      border-radius: 26px;
      background:
        radial-gradient(circle at 90% 10%, rgba(255,255,255,.18), transparent 25%),
        linear-gradient(135deg, #0759db, #063b9f);
      color: white;
      padding: 42px 30px;
      box-shadow: 0 25px 60px rgba(8,70,170,.18);
      animation: heroIn .7s ease both;
    }

    .hero-box::after {
      content: "";
      position: absolute;
      width: 250px;
      height: 250px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 50%;
      right: -90px;
      bottom: -120px;
    }

    .hero-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border-radius: 20px;
      background: rgba(255,255,255,.12);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    .hero-label i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #62e6aa;
      box-shadow: 0 0 10px #62e6aa;
    }

    .hero h1 {
      position: relative;
      z-index: 2;
      font-family: "Oswald", sans-serif;
      font-size: clamp(42px, 10vw, 78px);
      line-height: .95;
      letter-spacing: 1px;
    }

    .hero p {
      position: relative;
      z-index: 2;
      margin-top: 14px;
      opacity: .78;
      font-size: 13px;
      max-width: 480px;
    }

    .season-pill {
      position: relative;
      z-index: 2;
      display: inline-flex;
      margin-top: 25px;
      padding: 9px 15px;
      border-radius: 10px;
      background: white;
      color: var(--blue-dark);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .7px;
    }

    /* ================= CONTENT ================= */

    .content {
      max-width: 1180px;
      margin: auto;
      padding: 5px 20px 70px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 18px;
    }

    .section-title {
      font-family: "Oswald", sans-serif;
      font-size: 28px;
      letter-spacing: .4px;
    }

    .section-subtitle {
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
    }

    .search {
      width: 230px;
      height: 43px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: white;
      outline: none;
      padding: 0 14px;
      font-size: 12px;
      transition: .2s;
    }

    .search:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(8,102,255,.08);
    }

    /* ================= TOP THREE ================= */

    .podium {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }

    .podium-card {
      position: relative;
      overflow: hidden;
      background: white;
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 19px;
      box-shadow: var(--shadow);
      animation: cardIn .5s ease both;
    }

    .podium-card:nth-child(2) {
      animation-delay: .08s;
    }

    .podium-card:nth-child(3) {
      animation-delay: .16s;
    }

    .podium-rank {
      font-family: "Oswald", sans-serif;
      color: var(--blue);
      font-size: 30px;
      font-weight: 700;
    }

    .podium-logo {
      width: 58px;
      height: 58px;
      margin: 8px 0;
      border-radius: 14px;
      background: var(--blue-light);
      object-fit: contain;
      padding: 6px;
    }

    .podium-name {
      font-weight: 900;
      font-size: 15px;
    }

    .podium-tag {
      color: var(--muted);
      font-size: 10px;
      font-family: "Oswald", sans-serif;
      letter-spacing: 1px;
    }

    .podium-points {
      margin-top: 10px;
      font-family: "Oswald", sans-serif;
      color: var(--blue);
      font-size: 23px;
    }

    /* ================= RANKING ================= */

    .ranking {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rank-card {
      display: grid;
      grid-template-columns: 52px 55px 1fr auto;
      align-items: center;
      gap: 13px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 12px 16px;
      box-shadow: 0 5px 22px rgba(20,60,110,.04);
      cursor: pointer;
      animation: cardIn .45s ease both;
      transition: .25s ease;
    }

    .rank-card:hover {
      transform: translateY(-2px);
      border-color: rgba(8,102,255,.28);
      box-shadow: var(--shadow);
    }

    .rank-number {
      font-family: "Oswald", sans-serif;
      font-size: 22px;
      color: #a0aec0;
      text-align: center;
    }

    .rank-logo {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      object-fit: contain;
      padding: 5px;
      background: var(--blue-light);
    }

    .clan-name {
      font-size: 14px;
      font-weight: 900;
    }

    .clan-tag {
      display: inline-block;
      margin-left: 5px;
      color: var(--blue);
      font-family: "Oswald", sans-serif;
      font-size: 10px;
      letter-spacing: 1px;
    }

    .stats {
      display: flex;
      gap: 12px;
      margin-top: 4px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
    }

    .stats b {
      color: var(--text);
    }

    .points {
      text-align: right;
      font-family: "Oswald", sans-serif;
      font-size: 22px;
      color: var(--blue);
      white-space: nowrap;
    }

    .pts-label {
      display: block;
      font-family: "Cairo", sans-serif;
      color: var(--muted);
      font-size: 8px;
      letter-spacing: 1px;
    }

    /* ================= EMPTY / LOADING ================= */

    .loading,
    .empty {
      text-align: center;
      padding: 50px 20px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 17px;
      color: var(--muted);
      font-size: 12px;
    }

    .loader {
      width: 27px;
      height: 27px;
      border: 3px solid #dbe8ff;
      border-top-color: var(--blue);
      border-radius: 50%;
      margin: 0 auto 12px;
      animation: spin .8s linear infinite;
    }

    /* ================= FOOTER ================= */

    footer {
      border-top: 1px solid var(--border);
      background: white;
      text-align: center;
      padding: 25px 15px;
      color: var(--muted);
      font-size: 10px;
    }

    footer strong {
      color: var(--blue);
    }

    /* ================= ANIMATIONS ================= */

    @keyframes heroIn {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ================= MOBILE ================= */

    @media (max-width: 650px) {

      .nav {
        height: 64px;
        padding: 0 14px;
      }

      .admin-btn {
        padding: 8px 10px;
        font-size: 10px;
      }

      .hero {
        padding: 22px 12px 25px;
      }

      .hero-box {
        padding: 34px 21px;
        border-radius: 21px;
      }

      .hero h1 {
        font-size: 48px;
      }

      .content {
        padding: 0 12px 45px;
      }

      .section-head {
        align-items: stretch;
        flex-direction: column;
      }

      .search {
        width: 100%;
      }

      .podium {
        grid-template-columns: 1fr;
      }

      .podium-card {
        display: grid;
        grid-template-columns: 50px 1fr auto;
        align-items: center;
        gap: 10px;
      }

      .podium-logo {
        margin: 0;
      }

      .podium-rank {
        grid-row: span 2;
      }

      .podium-points {
        margin: 0;
      }

      .rank-card {
        grid-template-columns: 35px 45px 1fr auto;
        gap: 8px;
        padding: 11px 10px;
      }

      .rank-logo {
        width: 43px;
        height: 43px;
      }

      .rank-number {
        font-size: 18px;
      }

      .clan-name {
        font-size: 12px;
      }

      .stats {
        gap: 7px;
        font-size: 8px;
      }

      .points {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <nav class="nav">

    <a href="#" class="brand">
      <div class="brand-mark">EM</div>

      <div class="brand-text">
        <strong>E-MASTER</strong>
        <span>CLAN RANKING</span>
      </div>
    </a>

    <a href="admin.html" class="admin-btn">
      ADMIN PANEL
    </a>

  </nav>
</header>

<main>

  <section class="hero">
    <div class="hero-box">

      <div class="hero-label">
        <i></i>
        OFFICIAL CLAN RANKING
      </div>

      <h1>E-MASTER<br>RANKING</h1>

      <p>
        The competitive ranking system for professional eFootball clans.
      </p>

      <div class="season-pill" id="seasonPill">
        SEASON 01
      </div>

    </div>
  </section>


  <section class="content">

    <div class="section-head">

      <div>
        <div class="section-title">
          CLAN POWER RANKING
        </div>

        <div class="section-subtitle">
          Ranked by official E-MASTER points
        </div>
      </div>

      <input
        id="searchInput"
        class="search"
        type="search"
        placeholder="Search clan..."
      >

    </div>


    <div id="podium" class="podium"></div>

    <div id="ranking" class="ranking">

      <div class="loading">
        <div class="loader"></div>
        Loading ranking...
      </div>

    </div>

  </section>

</main>


<footer>
  <strong>E-MASTER</strong> · Professional eFootball Clan Ranking
</footer>


<script>

  /* ==========================================
     SUPABASE CONNECTION
  ========================================== */

  const SUPABASE_URL =
    "https://zapkpfsnxzgjaescmhqp.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_wIDyxzcK3VX0jGYU8THdAA_mW6njIY4";

  const { createClient } =
    supabase;

  const db =
    createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==========================================
     VARIABLES
  ========================================== */

  let allClans = [];
  let currentSeason = null;


  /* ==========================================
     START
  ========================================== */

  loadRanking();


  async function loadRanking() {

    const ranking =
      document.getElementById("ranking");

    try {

      /* Get active season */

      const {
        data: seasons,
        error: seasonError
      } = await db
        .from("seasons")
        .select("id, name, year, status")
        .eq("status", "active")
        .order("created_at", {
          ascending: false
        })
        .limit(1);

      if (seasonError)
        throw seasonError;


      if (!seasons || seasons.length === 0) {

        ranking.innerHTML = `
          <div class="empty">
            No active season available.
          </div>
        `;

        return;
      }
