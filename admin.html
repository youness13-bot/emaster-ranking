<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>E-MASTER | Admin Panel</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* =========================================
   RESET
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    background:#f5f8fc;

    color:#091a33;

    font-family:Cairo,sans-serif;

    overflow-x:hidden;
}

button,
input,
select{

    font-family:inherit;
}

button{
    cursor:pointer;
}


/* =========================================
   VARIABLES
========================================= */

:root{

    --blue:#075ff5;

    --blue-dark:#0346c7;

    --blue-light:#edf4ff;

    --dark:#08172e;

    --text:#182941;

    --muted:#78879c;

    --border:#e3eaf3;

    --green:#149b68;

    --red:#d74750;

    --white:#ffffff;

}


/* =========================================
   LOADING
========================================= */

#loading{

    position:fixed;

    inset:0;

    z-index:9999;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#f5f8fc;

    transition:.4s;
}

#loading.hide{

    opacity:0;

    visibility:hidden;
}

.loading-logo{

    width:62px;

    height:62px;

    display:flex;

    align-items:center;

    justify-content:center;

    margin:auto;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--blue-dark)
        );

    color:white;

    font-family:Oswald;

    font-size:20px;

    font-weight:700;

    animation:pulse 1.2s infinite;
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.06);
    }

}

.loading-text{

    margin-top:12px;

    text-align:center;

    font-family:Oswald;

    font-size:18px;
}


/* =========================================
   HEADER
========================================= */

.header{

    position:sticky;

    top:0;

    z-index:100;

    height:70px;

    background:
        rgba(255,255,255,.95);

    backdrop-filter:blur(15px);

    border-bottom:
        1px solid var(--border);
}

.header-inner{

    width:min(1200px,94%);

    height:100%;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.brand{

    display:flex;

    align-items:center;

    gap:10px;
}

.brand-logo{

    width:42px;

    height:42px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--blue-dark)
        );

    color:#fff;

    font-family:Oswald;

    font-size:14px;

    font-weight:700;
}

.brand-title{

    font-family:Oswald;

    font-size:20px;

    line-height:1;
}

.brand-sub{

    margin-top:3px;

    color:var(--muted);

    font-size:6px;

    font-weight:900;

    letter-spacing:1.4px;
}

.header-right{

    display:flex;

    align-items:center;

    gap:8px;
}

.view-btn,
.logout-btn{

    border:0;

    padding:9px 12px;

    border-radius:9px;

    font-size:8px;

    font-weight:900;

    text-decoration:none;

    transition:.2s;
}

.view-btn{

    background:var(--blue-light);

    color:var(--blue);
}

.logout-btn{

    background:#fff0f1;

    color:var(--red);
}

.view-btn:hover,
.logout-btn:hover{

    transform:translateY(-1px);
}


/* =========================================
   LAYOUT
========================================= */

.layout{

    width:min(1200px,94%);

    margin:30px auto 60px;

    display:grid;

    grid-template-columns:220px 1fr;

    gap:20px;
}


/* =========================================
   SIDEBAR
========================================= */

.sidebar{

    position:sticky;

    top:90px;

    align-self:start;

    padding:10px;

    background:white;

    border:1px solid var(--border);

    border-radius:16px;

    box-shadow:
        0 10px 30px
        rgba(20,50,90,.035);
}

.side-title{

    padding:9px 10px;

    color:#9aa6b6;

    font-size:6px;

    font-weight:900;

    letter-spacing:1.4px;
}

.side-btn{

    width:100%;

    display:flex;

    align-items:center;

    gap:9px;

    border:0;

    padding:11px;

    margin-bottom:3px;

    border-radius:9px;

    background:transparent;

    color:#63738a;

    text-align:left;

    font-size:8px;

    font-weight:900;

    transition:.2s;
}

.side-btn:hover{

    background:var(--blue-light);

    color:var(--blue);
}

.side-btn.active{

    background:var(--blue);

    color:white;

    box-shadow:
        0 8px 20px
        rgba(7,95,245,.16);
}


/* =========================================
   CONTENT
========================================= */

.content{

    min-width:0;
}

.page{

    display:none;

    animation:pageIn .3s ease;
}

.page.active{

    display:block;
}

@keyframes pageIn{

    from{

        opacity:0;

        transform:translateY(8px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}


/* =========================================
   PAGE HEAD
========================================= */

.page-head{

    display:flex;

    align-items:end;

    justify-content:space-between;

    gap:15px;

    margin-bottom:18px;
}

.page-small{

    color:var(--blue);

    font-size:7px;

    font-weight:900;

    letter-spacing:1.6px;
}

.page-title{

    margin-top:3px;

    font-family:Oswald;

    font-size:31px;
}

.page-desc{

    margin-top:4px;

    color:var(--muted);

    font-size:7px;
}


/* =========================================
   CARDS
========================================= */

.card{

    padding:20px;

    margin-bottom:16px;

    background:white;

    border:1px solid var(--border);

    border-radius:16px;

    box-shadow:
        0 10px 30px
        rgba(20,50,90,.035);
}

.card-title{

    margin-bottom:14px;

    font-family:Oswald;

    font-size:20px;
}


/* =========================================
   FORM
========================================= */

.form-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;
}

.field.full{

    grid-column:1/-1;
}

.field label{

    display:block;

    margin-bottom:6px;

    color:#62728a;

    font-size:7px;

    font-weight:900;
}

.field input,
.field select{

    width:100%;

    height:43px;

    padding:0 12px;

    border:1px solid #dce5ef;

    border-radius:9px;

    background:#fbfcfe;

    outline:none;

    color:var(--text);

    font-size:8px;

    transition:.2s;
}

.field input:focus,
.field select:focus{

    background:white;

    border-color:var(--blue);

    box-shadow:
        0 0 0 4px
        rgba(7,95,245,.07);
}


/* =========================================
   BUTTONS
========================================= */

.primary-btn{

    border:0;

    padding:11px 15px;

    border-radius:9px;

    background:var(--blue);

    color:white;

    font-size:8px;

    font-weight:900;

    transition:.2s;
}

.primary-btn:hover{

    background:var(--blue-dark);

    transform:translateY(-1px);
}

.secondary-btn{

    border:1px solid var(--border);

    padding:10px 14px;

    border-radius:9px;

    background:white;

    color:#607089;

    font-size:8px;

    font-weight:900;
}

.danger-btn{

    border:0;

    padding:8px 10px;

    border-radius:8px;

    background:#fff0f1;

    color:var(--red);

    font-size:7px;

    font-weight:900;
}

.edit-btn{

    border:0;

    padding:8px 10px;

    border-radius:8px;

    background:var(--blue-light);

    color:var(--blue);

    font-size:7px;

    font-weight:900;
}

.button-row{

    display:flex;

    gap:7px;

    flex-wrap:wrap;

    margin-top:14px;
}


/* =========================================
   CLAN TABLE
========================================= */

.table-wrap{

    overflow:auto;

    border:1px solid var(--border);

    border-radius:12px;
}

.clan-table{

    width:100%;

    min-width:650px;

    border-collapse:collapse;
}

.clan-table th{

    padding:11px;

    background:#f8fafd;

    color:#8290a2;

    border-bottom:
        1px solid var(--border);

    font-size:6px;

    font-weight:900;

    text-align:left;
}

.clan-table td{

    padding:11px;

    border-bottom:
        1px solid #edf1f6;

    font-size:8px;

    vertical-align:middle;
}

.clan-table tr:last-child td{

    border-bottom:0;
}

.table-logo{

    width:38px;

    height:38px;

    padding:4px;

    object-fit:contain;

    border-radius:9px;

    background:#f1f5fa;

    border:1px solid #e5ebf3;
}

.clan-name-cell{

    font-weight:900;
}

.clan-tag-cell{

    color:var(--muted);

    font-size:6px;

    margin-top:2px;
}

.status{

    display:inline-block;

    padding:5px 8px;

    border-radius:20px;

    font-size:6px;

    font-weight:900;
}

.status.active{

    background:#e8f8f1;

    color:var(--green);
}

.status.inactive{

    background:#fff0f1;

    color:var(--red);
}


/* =========================================
   RANKING TABLE
========================================= */

.ranking-table{

    width:100%;

    min-width:850px;

    border-collapse:collapse;
}

.ranking-table th{

    padding:11px;

    background:#f8fafd;

    color:#8290a2;

    border-bottom:
        1px solid var(--border);

    font-size:6px;

    font-weight:900;

    text-align:center;
}

.ranking-table td{

    padding:9px 7px;

    border-bottom:
        1px solid #edf1f6;

    text-align:center;
}

.ranking-table input{

    width:65px;

    height:34px;

    padding:0 6px;

    border:1px solid #dce5ef;

    border-radius:7px;

    outline:none;

    text-align:center;

    font-family:Oswald;

    font-size:13px;
}

.ranking-table input:focus{

    border-color:var(--blue);
}

.rank-logo{

    width:34px;

    height:34px;

    object-fit:contain;

    padding:4px;

    border-radius:8px;

    background:#f1f5fa;
}


/* =========================================
   SEASON
========================================= */

.season-status{

    display:flex;

    align-items:center;

    gap:7px;

    padding:10px 12px;

    background:var(--blue-light);

    color:var(--blue);

    border-radius:9px;

    font-size:7px;

    font-weight:900;
}


/* =========================================
   MESSAGE
========================================= */

#message{

    position:fixed;

    right:18px;

    bottom:18px;

    z-index:1000;

    max-width:320px;

    padding:12px 15px;

    border-radius:10px;

    background:var(--dark);

    color:white;

    font-size:8px;

    font-weight:800;

    box-shadow:
        0 15px 35px
        rgba(0,0,0,.15);

    opacity:0;

    visibility:hidden;

    transform:translateY(10px);

    transition:.25s;
}

#message.show{

    opacity:1;

    visibility:visible;

    transform:translateY(0);
}

#message.success{

    background:var(--green);
}

#message.error{

    background:var(--red);
}


/* =========================================
   MODAL
========================================= */

.modal{

    position:fixed;

    inset:0;

    z-index:500;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
        rgba(4,17,38,.55);

    backdrop-filter:blur(7px);

    opacity:0;

    visibility:hidden;

    transition:.25s;
}

.modal.show{

    opacity:1;

    visibility:visible;
}

.modal-box{

    width:min(550px,100%);

    max-height:90vh;

    overflow:auto;

    background:white;

    border-radius:18px;

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.20);

    transform:
        translateY(15px)
        scale(.98);

    transition:.25s;
}

.modal.show .modal-box{

    transform:
        translateY(0)
        scale(1);
}

.modal-head{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:18px 20px;

    border-bottom:
        1px solid var(--border);
}

.modal-title{

    font-family:Oswald;

    font-size:22px;
}

.close{

    width:32px;

    height:32px;

    border:0;

    border-radius:8px;

    background:#f1f4f8;

    color:#65758b;

    font-size:17px;
}

.modal-body{

    padding:20px;
}


/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:850px){

    .layout{

        grid-template-columns:1fr;
    }

    .sidebar{

        position:static;

        display:flex;

        gap:4px;

        overflow:auto;

        padding:6px;
    }

    .side-title{

        display:none;
    }

    .side-btn{

        min-width:max-content;

        margin:0;

    }

}

@media(max-width:600px){

    .header{

        height:64px;
    }

    .header-inner{

        width:94%;
    }

    .brand-title{

        font-size:18px;
    }

    .brand-sub{

        font-size:5px;
    }

    .view-btn{

        display:none;
    }

    .layout{

        width:94%;

        margin-top:18px;
    }

    .page-title{

        font-size:27px;
    }

    .page-head{

        align-items:flex-start;

        flex-direction:column;
    }

    .form-grid{

        grid-template-columns:1fr;
    }

    .field.full{

        grid-column:auto;
    }

    .card{

        padding:15px;
    }

}

</style>

</head>


<body>


<!-- =========================================
     LOADING
========================================= -->

<div id="loading">

    <div>

        <div class="loading-logo">
            EM
        </div>

        <div class="loading-text">
            ADMIN PANEL
        </div>

    </div>

</div>


<!-- =========================================
     HEADER
========================================= -->

<header class="header">

    <div class="header-inner">


        <div class="brand">

            <div class="brand-logo">
                EM
            </div>

            <div>

                <div class="brand-title">
                    E-MASTER
                </div>

                <div class="brand-sub">
                    ADMINISTRATION PANEL
                </div>

            </div>

        </div>


        <div class="header-right">

            <a
                href="index.html"
                class="view-btn"
            >
                VIEW WEBSITE
            </a>

            <button
                class="logout-btn"
                onclick="logout()"
            >
                LOGOUT
            </button>

        </div>


    </div>

</header>


<!-- =========================================
     LAYOUT
========================================= -->

<div class="layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="side-title">
            MANAGEMENT
        </div>


        <button
            class="side-btn active"
            data-page="dashboard"
            onclick="openPage('dashboard')"
        >
            ◈ Dashboard
        </button>


        <button
            class="side-btn"
            data-page="clans"
            onclick="openPage('clans')"
        >
            ◈ Clans
        </button>


        <button
            class="side-btn"
            data-page="ranking"
            onclick="openPage('ranking')"
        >
            ◈ Ranking
        </button>


        <button
            class="side-btn"
            data-page="seasons"
            onclick="openPage('seasons')"
        >
            ◈ Seasons
        </button>

    </aside>


    <!-- CONTENT -->

    <main class="content">


        <!-- =================================
             DASHBOARD
        ================================== -->

        <section
            id="page-dashboard"
            class="page active"
        >

            <div class="page-head">

                <div>

                    <div class="page-small">
                        CONTROL CENTER
                    </div>

                    <h1 class="page-title">
                        Dashboard
                    </h1>

                    <p class="page-desc">
                        Manage your E-MASTER ranking system.
                    </p>

                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    Current Season
                </div>

                <div
                    id="dashboardSeason"
                    class="season-status"
                >
                    Loading...
                </div>

            </div>


            <div
                style="
                    display:grid;
                    grid-template-columns:
                        repeat(3,1fr);
                    gap:12px;
                "
                id="dashboardStats"
            >

                <div class="card">

                    <div
                        style="
                            color:#78879c;
                            font-size:7px;
                            font-weight:900;
                        "
                    >
                        CLANS
                    </div>

                    <div
                        id="statClans"
                        style="
                            margin-top:5px;
                            color:#075ff5;
                            font-family:Oswald;
                            font-size:32px;
                        "
                    >
                        0
                    </div>

                </div>


                <div class="card">

                    <div
                        style="
                            color:#78879c;
                            font-size:7px;
                            font-weight:900;
                        "
                    >
                        RANKED CLANS
                    </div>

                    <div
                        id="statRanked"
                        style="
                            margin-top:5px;
                            color:#075ff5;
                            font-family:Oswald;
                            font-size:32px;
                        "
                    >
                        0
                    </div>

                </div>


                <div class="card">

                    <div
                        style="
                            color:#78879c;
                            font-size:7px;
                            font-weight:900;
                        "
                    >
                        ACTIVE SEASON
                    </div>

                    <div
                        id="statSeason"
                        style="
                            margin-top:5px;
                            color:#075ff5;
                            font-family:Oswald;
                            font-size:20px;
                        "
                    >
                        —
                    </div>

                </div>

            </div>

        </section>


        <!-- =================================
             CLANS
        ================================== -->

        <section
            id="page-clans"
            class="page"
        >

            <div class="page-head">

                <div>

                    <div class="page-small">
                        CLAN MANAGEMENT
                    </div>

                    <h1 class="page-title">
                        Clans
                    </h1>

                    <p class="page-desc">
