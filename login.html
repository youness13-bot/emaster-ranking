<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>E-MASTER | Admin Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Oswald:wght@500;600;700&display=swap"
rel="stylesheet"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    background:

        radial-gradient(
            circle at top right,
            rgba(7,95,245,.13),
            transparent 35%
        ),

        #f5f8fc;

    font-family:Cairo,sans-serif;

    color:#08172e;

}


.login-box{

    width:min(420px,92%);

    background:#fff;

    border:1px solid #e4ebf3;

    border-radius:22px;

    padding:32px;

    box-shadow:
        0 25px 70px rgba(10,45,90,.10);

    animation:
        appear .5s ease;

}


@keyframes appear{

    from{

        opacity:0;

        transform:
            translateY(15px)
            scale(.98);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


.logo{

    width:58px;

    height:58px;

    display:flex;

    align-items:center;

    justify-content:center;

    margin:0 auto 15px;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            #075ff5,
            #0346c7
        );

    color:#fff;

    font-family:Oswald;

    font-size:20px;

    font-weight:700;

    box-shadow:
        0 12px 25px
        rgba(7,95,245,.20);

}


.title{

    text-align:center;

}


.title h1{

    font-family:Oswald;

    font-size:30px;

}


.title p{

    margin-top:3px;

    color:#7c8da3;

    font-size:8px;

    font-weight:800;

    letter-spacing:1.3px;

}


.form{

    margin-top:28px;

}


.field{

    margin-bottom:15px;

}


.field label{

    display:block;

    margin-bottom:6px;

    color:#607089;

    font-size:8px;

    font-weight:900;

}


.field input{

    width:100%;

    height:46px;

    padding:0 13px;

    border:1px solid #dce5ef;

    border-radius:11px;

    background:#fbfcfe;

    outline:none;

    font-family:Cairo;

    font-size:9px;

    transition:.2s;

}


.field input:focus{

    background:#fff;

    border-color:#075ff5;

    box-shadow:
        0 0 0 4px
        rgba(7,95,245,.07);

}


.login-btn{

    width:100%;

    height:47px;

    border:0;

    border-radius:11px;

    background:#075ff5;

    color:#fff;

    font-family:Cairo;

    font-size:9px;

    font-weight:900;

    cursor:pointer;

    transition:.2s;

}


.login-btn:hover{

    background:#0346c7;

    transform:translateY(-1px);

}


.login-btn:disabled{

    opacity:.65;

    cursor:not-allowed;

}


.error{

    display:none;

    margin-top:13px;

    padding:10px;

    border-radius:9px;

    background:#fff0f1;

    color:#d74750;

    text-align:center;

    font-size:8px;

    font-weight:800;

}


.back{

    display:block;

    margin-top:18px;

    text-align:center;

    color:#78879c;

    text-decoration:none;

    font-size:8px;

    font-weight:800;

}


.back:hover{

    color:#075ff5;

}


</style>

</head>


<body>


<div class="login-box">


    <div class="logo">
        EM
    </div>


    <div class="title">

        <h1>
            ADMIN LOGIN
        </h1>

        <p>
            E-MASTER RANKING SYSTEM
        </p>

    </div>


    <form
        class="form"
        id="loginForm"
    >


        <div class="field">

            <label>
                EMAIL
            </label>

            <input
                id="email"
                type="email"
                placeholder="admin@email.com"
                autocomplete="email"
                required
            >

        </div>


        <div class="field">

            <label>
                PASSWORD
            </label>

            <input
                id="password"
                type="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
            >

        </div>


        <button
            class="login-btn"
            id="loginBtn"
            type="submit"
        >

            LOGIN TO ADMIN PANEL

        </button>


        <div
            class="error"
            id="error"
        ></div>


    </form>


    <a
        href="index.html"
        class="back"
    >

        ← BACK TO RANKING

    </a>


</div>


<script>


const SUPABASE_URL =
"https://zapkpfsnxzgjaescmhqp.supabase.co";


const SUPABASE_KEY =
"sb_publishable_wIDyxzcK3VX0jGYU8THdAA_mW6njIY4";


const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const form =
document.getElementById(
    "loginForm"
);


const button =
document.getElementById(
    "loginBtn"
);


const errorBox =
document.getElementById(
    "error"
);


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        errorBox.style.display =
            "none";


        button.disabled =
            true;


        button.textContent =
            "LOGGING IN...";


        const email =
        document
            .getElementById(
                "email"
            )
            .value
            .trim();


        const password =
        document
            .getElementById(
                "password"
            )
            .value;


        const result =
        await db.auth.signInWithPassword({

            email:email,

            password:password

        });


        if(result.error){

            errorBox.textContent =
                "Email or password is incorrect.";

            errorBox.style.display =
                "block";

            button.disabled =
                false;

            button.textContent =
                "LOGIN TO ADMIN PANEL";

            return;

        }


        const user =
            result.data.user;


        const admin =
        await db
            .from("admin_users")
            .select("user_id")
            .eq(
                "user_id",
                user.id
            )
            .maybeSingle();


        if(
            admin.error ||
            !admin.data
        ){

            await db.auth.signOut();


            errorBox.textContent =
                "This account is not authorized as admin.";

            errorBox.style.display =
                "block";


            button.disabled =
                false;

            button.textContent =
                "LOGIN TO ADMIN PANEL";

            return;

        }


        window.location.href =
            "admin.html";

    }

);


</script>

</body>

</html>
